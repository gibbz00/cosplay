[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata]
crane.name = "async-wayland"

[workspace.dependencies]
async-wayland-ancillary = { path = "./crates/ancillary" }

bytes = "1"
futures-core = "0.3"
rustix = "1"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"

# Testing
serial_test = { version = "4", default-features = false }
