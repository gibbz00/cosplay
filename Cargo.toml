[workspace]
members = ["crates/*", "protocols/*"]
resolver = "3"

[workspace.package]
authors = ["gibbz00"]
edition = "2024"
exclude = ["/.github"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/gibbz00/async-wayland"
version = "0.1.0"

[workspace.dependencies]
async-wayland-client = { path = "./crates/client" }
async-wayland-common = { path = "./crates/common" }

anyhow = "1"
bytes = "1.11"
futures-util = { version = "0.3", default-features = false }
impl-tools = "0.11"
thiserror = "2"
tokio = "1.48"
tokio-util = "0.7"
paste = "1"

# TEMP: prototyping dependency
sealed = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
self_named_module_files = "deny"

[profile.dev]
debug = 0
strip = "debuginfo"
