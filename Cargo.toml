[workspace]
members = [
  "crates/agent/common",
  "crates/client/*",
  "crates/codegen/*",
  "crates/protocols/*",
  "crates/wire/*",
  "examples/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata]
crane.name = "cosplay"

[workspace.dependencies]
# Wire
cosplay-ancillary = { path = "./crates/wire/ancillary" }
cosplay-codec = { path = "./crates/wire/codec" }
cosplay-net = { path = "./crates/wire/net" }
# Codegen
cosplay-generator = { path = "./crates/codegen/generator" }
cosplay-scanner = { path = "./crates/codegen/scanner" }
cosplay-xml = { path = "./crates/codegen/xml" }
# Agent
cosplay-agent = { path = "./crates/agent/common" }
cosplay-core-client = { path = "./crates/client/core" }
cosplay-wayland-client = { path = "./crates/client/wayland" }
cosplay-xdg-shell-client = { path = "./crates/client/xdg-shell" }
# Protocols
cosplay-protocols-wayland = { path = "./crates/protocols/wayland" }
cosplay-protocols-xdg-shell = { path = "./crates/protocols/xdg-shell" }

anyhow = "1"
async-channel = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
heck = "0.5"
indoc = "2"
prettyplease = "0.3"
proc-macro2 = "1"
quick-xml = "0.41"
quote = "1"
rustix = "1"
serde = "1"
syn = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
toml = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"

# Prototyping
i24 = "2"
impl-tools = "0.13"
sealed = "0.7"

# Testing
serial_test = { version = "4", default-features = false }
