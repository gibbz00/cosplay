[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["gibbz00"]
edition = "2024"
exclude = ["/.github"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/gibbz00/async-wayland"
version = "0.1.0"

[workspace.dependencies]


[workspace.lints.rust]
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
self_named_module_files = "deny"

[profile.dev]
debug = 0
strip = "debuginfo"
